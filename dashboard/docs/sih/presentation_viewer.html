<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIES — SIH 2026 Visual Presentation Deck</title>
    <style>
        :root {
            --bg-base: #06090e;
            --accent-orange: #ff5722;
            --accent-amber: #ffb300;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-base); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(10px); border-radius: 10px; border: 1px solid rgba(255, 87, 34, 0.3); margin-bottom: 20px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .badge { background: var(--accent-orange); color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: 800; font-size: 13px; }
        .controls { display: flex; gap: 12px; align-items: center; }
        button { background: #1e283d; color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 18px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        button:hover { background: var(--accent-orange); }
        .slide-container { width: 100%; max-width: 1200px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255, 87, 34, 0.3); box-shadow: 0 10px 40px rgba(0,0,0,0.8); position: relative; }
        .slide-container img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .slide-container img.active { display: block; }
        .thumbnails { display: flex; gap: 12px; max-width: 1200px; width: 100%; margin-top: 20px; overflow-x: auto; padding-bottom: 10px; }
        .thumb { flex: 1; min-width: 140px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: 0.6; transition: all 0.2s; }
        .thumb:hover, .thumb.active { opacity: 1; border-color: var(--accent-orange); transform: scale(1.03); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span class="badge">ALPHA-X</span>
            <div>
                <h1 style="font-size:16px;">ARIES — Visual Idea Presentation Deck</h1>
                <p style="font-size:11px; color:var(--accent-amber);">Smart India Hackathon 2026 | Problem Statement: SIH26223</p>
            </div>
        </div>
        <div class="controls">
            <span id="counter" style="font-size:13px; font-weight:600; color:var(--text-secondary);">Slide 1 of 6</span>
            <button onclick="prev()">◀ Prev</button>
            <button onclick="next()">Next ▶</button>
            <a href="SIH2026_ARIES_ALPHA-X.pptx" download><button style="background:var(--accent-orange);">📥 Download PPTX</button></a>
        </div>
    </header>

    <div class="slide-container">
        <img src="../../assets/images/slide_1.png" class="active" id="s1" alt="Slide 1">
        <img src="../../assets/images/slide_2.png" id="s2" alt="Slide 2">
        <img src="../../assets/images/slide_3.png" id="s3" alt="Slide 3">
        <img src="../../assets/images/slide_4.png" id="s4" alt="Slide 4">
        <img src="../../assets/images/slide_5.png" id="s5" alt="Slide 5">
        <img src="../../assets/images/slide_6.png" id="s6" alt="Slide 6">
    </div>

    <div class="thumbnails">
        <div class="thumb active" onclick="go(1)"><img src="../../assets/images/slide_1.png"></div>
        <div class="thumb" onclick="go(2)"><img src="../../assets/images/slide_2.png"></div>
        <div class="thumb" onclick="go(3)"><img src="../../assets/images/slide_3.png"></div>
        <div class="thumb" onclick="go(4)"><img src="../../assets/images/slide_4.png"></div>
        <div class="thumb" onclick="go(5)"><img src="../../assets/images/slide_5.png"></div>
        <div class="thumb" onclick="go(6)"><img src="../../assets/images/slide_6.png"></div>
    </div>

    <script>
        let cur = 1;
        const total = 6;
        function show(n) {
            document.querySelectorAll('.slide-container img').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            document.getElementById('s' + n).classList.add('active');
            document.querySelectorAll('.thumb')[n-1].classList.add('active');
            document.getElementById('counter').innerText = `Slide ${n} of ${total}`;
            cur = n;
        }
        function next() { if (cur < total) show(cur + 1); }
        function prev() { if (cur > 1) show(cur - 1); }
        function go(n) { show(n); }
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') next();
            if (e.key === 'ArrowLeft') prev();
        });
    </script>
</body>
</html>
